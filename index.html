<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUỔI TRẺ - SỰ KIỆN MỚI</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green-50: #f0fdf4;
      --green-100: #dcfce7;
      --green-400: #4ade80;
      --green-500: #22c55e;
      --green-600: #16a34a;
      --green-700: #15803d;
      --text-dark: #14532d;
      --text-muted: #3f6212;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #000;
      color: var(--text-dark);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 1;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 20px;
      padding: 48px 32px 40px;
      text-align: center;
      box-shadow:
        0 4px 24px rgba(22, 163, 74, 0.08),
        0 1px 3px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(34, 197, 94, 0.12);
    }

    /* --- Loading --- */
    .loading-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .loading-wrap.hide {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    .loading-visual {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    .loading-visual svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .loading-ring {
      transform-origin: 48px 48px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-device {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .loading-device svg {
      width: 32px;
      height: 32px;
    }

    .loading-text {
      width: 100%;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      line-height: 1.4;
    }

    .loading-dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }

    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
      100% { content: ""; }
    }

    /* --- Result --- */
    .result-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.5s ease 0.1s, transform 0.5s ease 0.1s;
    }

    .result-wrap.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .check-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--green-100);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.45s ease;
    }

    .check-icon svg {
      width: 40px;
      height: 40px;
    }

    .check-icon svg .icon-stroke {
      stroke: var(--green-600);
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .check-icon svg .icon-fill {
      fill: var(--green-600);
    }

    .check-icon svg .tick-path {
      stroke: var(--green-600);
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      animation: draw 0.5s ease 0.2s forwards;
    }

    @keyframes pop {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    .status-text {
      width: 100%;
      max-width: 300px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--green-700);
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    .btn-register {
      display: inline-block;
      width: 100%;
      max-width: 280px;
      padding: 15px 28px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      background: linear-gradient(180deg, var(--green-500) 0%, var(--green-600) 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-register:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
      background: linear-gradient(180deg, #2dd46a 0%, var(--green-600) 100%);
    }

    .btn-register:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
    }

    .card-inner {
      position: relative;
      width: 100%;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="op3.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  <div class="card">
    <div class="card-inner">

      <!-- Giai đoạn loading 8 giây -->
      <div class="loading-wrap" id="loading">
        <div class="loading-visual">
          <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="48" cy="48" r="42" stroke="#dcfce7" stroke-width="5"/>
            <circle
              class="loading-ring"
              cx="48" cy="48" r="42"
              stroke="#22c55e"
              stroke-width="5"
              stroke-linecap="round"
              stroke-dasharray="66 198"
            />
          </svg>
          <div class="loading-device">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="7" y="2" width="10" height="20" rx="2" stroke="#16a34a" stroke-width="1.6"/>
              <line x1="10" y1="18" x2="14" y2="18" stroke="#16a34a" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="12" cy="6" r="0.8" fill="#16a34a"/>
            </svg>
          </div>
        </div>
        <p class="loading-text">Đang kiểm tra thiết bị<span class="loading-dots"></span></p>
      </div>

      <!-- Kết quả sau 8 giây -->
      <div class="result-wrap" id="result">
        <div class="check-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path class="icon-stroke" d="M24 4L8 10v11c0 9.5 6.8 18.4 16 21 9.2-2.6 16-11.5 16-21V10L24 4z"/>
            <path class="tick-path" d="M17 24l5 5 9-10"/>
          </svg>
        </div>
        <p class="status-text">ĐÃ KIỂM TRA THIẾT BỊ ĐỦ ĐIỀU KIỆN</p>
        <a href="https://ads001.adsbyg88.top/register.html" class="btn-register" id="btnRegister">ĐĂNG KÝ NGAY</a>
      </div>

    </div>
  </div>

  <script>
    const LOADING_TIME = 8000; // 8 giây
    const REGISTER_URL = 'https://ads001.adsbyg88.top/register.html';

    setTimeout(function () {
      document.getElementById('loading').classList.add('hide');
      document.getElementById('result').classList.add('show');
    }, LOADING_TIME);

    document.getElementById('btnRegister').addEventListener('click', function (e) {
      e.preventDefault();
      var url = this.getAttribute('href') || REGISTER_URL;
      var redirected = false;

      function goRegister() {
        if (redirected || !url || url === '#') return;
        redirected = true;
        window.location.href = url;
      }

      if (typeof fbq === 'function') {
        fbq('track', 'Lead', {}, { eventCallback: goRegister });
      }

      setTimeout(goRegister, 500);
    });
  </script>

</body>
</html>
